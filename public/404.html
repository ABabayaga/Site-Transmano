<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada · Transmano Transportes</title>
    <link rel="icon" type="image/png" href="/Logo-Transmano.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        min-height: 100svh;
        padding: 24px;
        background: #171717;
        color: #fff;
        text-align: center;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }

      .logo {
        width: 160px;
        max-width: 60vw;
        height: auto;
      }

      .code {
        font-family: 'Anton', system-ui, sans-serif;
        font-size: clamp(72px, 18vw, 160px);
        line-height: 1;
        color: #f5c518;
        letter-spacing: 2px;
      }

      h1 {
        font-size: clamp(18px, 3vw, 24px);
        font-weight: 600;
        color: #fff;
      }

      p {
        max-width: 420px;
        font-size: 15px;
        line-height: 1.6;
        color: #9ca3af;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 14px 28px;
        border-radius: 999px;
        background: #f5c518;
        color: #131313;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      .btn:hover,
      .btn:focus-visible {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/Logo-Transmano-branca.png" alt="Transmano Transportes" />
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi movido. Volte para a página inicial e continue navegando.</p>
    <a class="btn" href="/">Voltar para a home</a>
  </body>
</html>
